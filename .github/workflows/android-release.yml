name: Build Signed Android APK
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Download Godot 4.3 (Linux)
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

      - name: Download Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz
          mv templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Import Godot project
        run: |
          godot --headless --path . --import || true
          godot --headless --path . --editor --quit || true

      - name: Inject Editor Settings (SDK & Java Paths)
        run: |
          godot --headless --path . --set_editor_setting "export/android/android_sdk_path" "$ANDROID_SDK_ROOT"
          godot --headless --path . --set_editor_setting "export/android/java_sdk_path" "$JAVA_HOME"

      - name: Export unsigned APK
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Android" build/geta-iv-sivis-unsigned.apk

      - name: Decode signing keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Sign APK with apksigner
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks release.keystore \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out build/geta-iv-sivis-signed.apk \
            build/geta-iv-sivis-unsigned.apk
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/geta-iv-sivis-signed.apk
          generate_release_notes: true
